[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pushpilot"
version = "1.0.0"
description = "PushPilot - Intelligent multi-framework Git autopilot that watches features and ships them to GitHub"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "PushPilot Developers" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.scripts]
pushpilot = "autopush.cli:main"
pilot = "autopush.cli:main"
auto-push = "autopush.cli:main"
autopush = "autopush.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["autopush*"]
