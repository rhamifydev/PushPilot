[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pushpilot"
version = "1.1.2"
description = "PushPilot - Intelligent multi-framework Git autopilot that watches features, detects AI coding context, and ships to GitHub"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "PushPilot Developers" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
Homepage = "https://github.com/rhamifydev/PushPilot"
Repository = "https://github.com/rhamifydev/PushPilot.git"
Issues = "https://github.com/rhamifydev/PushPilot/issues"

[project.scripts]
pilot = "autopush.cli:main"
push = "autopush.cli:main"
pushpilot = "autopush.cli:main"
auto-push = "autopush.cli:main"
autopush = "autopush.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["autopush*"]
